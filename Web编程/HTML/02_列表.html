<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 1. 无序列表 -->
    <!-- 
        ul: 无序列表整体
        li: 子标签 
        注意：
            ul标签只允许包含li标签
            li标签可以包含任意内容
        显示模式默认前面有小点点
        如果想取消，利用CSS：list-style: none;
    -->
    <ul>
        <li>榴莲</li>
        <li>香蕉</li>
        <li>苹果</li>
    </ul>

    <!-- 2. 有序列表(自动带序列标签) -->
    <ol>
        <li>张三: 100</li>
        <li>李四: 95</li>
    </ol>

    <!-- 3. 自定义列表 -->
    <!-- 
        dl: 表示自定义列表的整体，用于包裹dt/dd标签
        dt: 表示自定义列表的主题
        dd: 表示自定义列表的针对主题的每一项内容

        注意：
            dl标签中只允许包含dt/dd标签
            dt/dd标签可以包含任意内容
     -->
    <dl>
        <dt>帮助中心</dt>
        <dd>账户管理</dd>
        <dd>用户指南</dd>
    </dl>

</body>
</html>
