<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 标题 -->
    <h1>1级标题</h1>
    <h2>2级标题</h2>
    <h3>3级标题</h3>
    <h4>4级标题</h4>
    <h5>5级标题</h5>
    <h6>6级标题</h6>

    <!-- 分割线 -->
    <hr>

    <!-- 段落, br为换行-->
    <p>一段话一段话<br>一段话</p> 

    <!-- 文本格式化标签 -->
    <b>加粗</b>
    <strong>加粗</strong>

    <u>下划线</u> 
    <ins>下划线</ins>

    <i>斜体字</i>
    <em>斜体字</em>

    <s>删除线</s>
    <del>删除线</del>

    <!-- 图片标签 -->
    <img src="./th.jpg" alt="这是一只猫" title="这是title文字,鼠标悬停的时候会显示" width="800" height="400">
    <!-- src = 图片路径，alt = 替换文本, 当图片不显示的时候显示alt的内容 -->
    <!-- width和height属性只给出一个值时整个图片会等比例缩小 -->

    <!-- 音频标签 -->
    <audio src="阿卡贝拉《千与千寻》.mp3" controls></audio>
    <!-- 
        src 音频的路径
        controls 音频播放器
        autoplay 自动播放(部分浏览器不支持)
        loop 循环播放

        注意：音频标签目前支持三种格式：MP3、Wav、Ogg
     -->

    <!-- 视频标签 -->
    <video src="open.mp4" controls width="800"></video>
    <!-- 
        src 视频的路径
        controls 视频播放器
        autoplay 自动播放(谷歌浏览器中需配合muted实现静音播放)
        loop 循环播放
     -->

    <!-- 超链接标签 -->
    <br>
    <a href="http://www.baidu.com/">跳转到百度</a>
    <br>
    <!-- 当开发网站初期，我们还不知道跳转地址的时候，href的值书写为#(表示空连接) -->
    <a href="#">空链接,不知道跳到哪里去</a>
    <!-- 
        属性值：target 目标网页的打开形式
        _self 默认值,在当前窗口中直接跳转
        _blank 在新窗口中跳转
    -->
    <br>
    <a href="http://www.baidu.com/" target="_blank">跳转到百度</a>

</body>
</html>
