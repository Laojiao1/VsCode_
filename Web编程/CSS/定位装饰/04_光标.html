<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 200px;
            height: 200px;
            background-color: pink;
            /* 
                default: 默认值，通常是箭头
                pointer: 小手 可以点击
                text: 工字形，提示用户可以显示文字
                move: 十字光标
             */
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
