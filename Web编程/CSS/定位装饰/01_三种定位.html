<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .father {

            width: 400px;
            height: 400px;
            background-color: pink;
        }
        .son {
            /* 父级使用相对定位 */
            position: relative;
            left:30px;
            top:40px;


            width: 300px;
            height: 300px;
            background-color: skyblue;
        }
        .grandson {
            /* 子级使用绝对定位 */
            /* 注意：绝对定位的显示模式是行内块模式，意味着如果不给宽度的话是不会显示出来的 */
            position: absolute;
            right: 20px;
            bottom:30px;

            width: 200px;
            height: 200px;
            background-color: green;
        }
        /* 绝对定位查找父级的方式:就近找定位的父级,如果逐层找不到这样的父级,就以浏览器窗口为参照物进行定位 */

        .regular {
            /* 固定定位 */
            position: fixed;
            width: 100%;
            height: 30px;
            background-color: aqua;
        }

    </style>
</head>
<body>
    <div class="regular">

    </div>
    <div class="father">
        <div class="son">
            <div class="grandson">

            </div>
        </div>
    </div>
</body>
</html>
