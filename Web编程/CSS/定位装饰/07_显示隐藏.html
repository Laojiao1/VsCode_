<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
            占位的隐藏：
                visibility: hidden;

            不占位置的隐藏：
                display: none;
        */
        div {
            width: 200px;
            height: 200px;
        }
        .one {
            /* visibility: hidden; */
            display: none;
            background-color: pink;
        }
        .two {
            background-color: green;
        }
    </style>
</head>
<body>
    <div class="one">one</div>
    <div class="two">two</div>
</body>
</html>
