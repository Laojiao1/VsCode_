<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            /* 1. 文本样式 */
            font-size: 30px;
            font-weight: 500; /* 文字粗细 */
            font-style: italic; /* 文字倾斜 */
            font-family: 微软雅黑, 黑体, sans-serif; /* 字体 */
        }
        .style {
            /* 简写方式 -- 复合属性 */
            /* style weight size/line-height family */
            font: italic 700 66px 黑体;
        }
        div {
            /*  
                3. 文本缩进 
                em:一个字的大小 
            */
            text-indent: 2em;
            /* 
                5. 行高 
                line-height
                取值：
                    数字+px
                    倍数(当前标签font-size的倍数)
             */
            line-height: 50px;
            /* 拓展：标签水平居中 */
            background-color: pink;
            margin: 0 auto;
        }
        h1 {
            /* 
                2. 文本水平对齐方式

                left 左对齐
                center 居中对齐
                right 右对齐

                文本，span标签，a标签，input标签，img标签都可以更改对齐方式(在父级标签中添加属性)
            */
            text-align: center;
        }
        
        /*
        4. 文本装饰：text-decoration:
            下划线：underline;
            删除线：line-through
            上划线：overline
            无装饰线：none
         */
        a {
            text-decoration: none;
            /* 无装饰线 */
        }

    </style>
</head>
<body>
    <!-- 浏览器中默认字号是16 -->
    <p>段落文字</p>
    <p class="style">段落文字2</p>
    <h1>新闻标题</h1>
    <div>东部战区新闻发言人施毅陆军大校表示,2月27日,美1架P-8A反潜巡逻机穿航台湾海峡并公开炒作。中国人民解放军<strong>东部战区</strong>组织兵力对美机穿航行动全程跟监警戒,一切尽在掌握。美方行为蓄意干扰破坏地区局势，危害台海和平稳定我们对此表示坚决反对。战区部队随时保持高度戒备，坚决捍卫国家主权和领土完整。</div>
    <a href="http:\\www.baidu.com">这里是超链接</a>
    

</body>
</html>
